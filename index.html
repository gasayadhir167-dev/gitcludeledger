<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-visual">
<title>流水账</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="流水账">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F5F3EE; --surf:#FFFFFF;
    --ink:#16211C; --ink-soft:#5F6C65; --ink3:#98A29C;
    --pine:#1E4B3A; --pine-d:#153529;
    --clay:#C75C39; --teal:#2E7D6B; --warn:#D9A441; --danger:#B3453C;
    --line:#E8E5DD; --fill:#EFEDE7;
    --sh:0 3px 14px rgba(20,33,28,.07);
    --sh-lg:0 5px 20px rgba(20,33,28,.11);
    /* 兼容旧名 */
    --paper:#F5F3EE; --paper-hi:#FFFFFF; --gold:#1E4B3A; --green:#2E7D6B; --amber:#B8791F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;
    font-size:15px;line-height:1.5;display:flex;flex-direction:column;overscroll-behavior:none}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  svg{display:block}

  /* ══ 顶部：只在「记一笔」显示 ══ */
  header{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) 24px 0}
  body:not(.rec) header{display:none}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .seg{display:flex;background:#EAE7E0;border-radius:999px;padding:2px}
  .seg button{padding:7px 20px;border-radius:999px;font-size:13.5px;color:var(--ink3)}
  .seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
  .sub{font-size:12.5px;color:var(--ink3);min-height:18px}
  .hrow .sub{border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-height:0}
  .amount{font-size:52px;font-weight:700;line-height:1.05;margin:18px 0 0;
    display:flex;align-items:baseline;gap:7px;letter-spacing:-.03em;
    transition:transform .16s ease,opacity .16s ease}
  .amount .cur{font-size:21px;font-weight:500;color:var(--ink3)}
  .amount.zero{color:#CFCFC7}
  .amount.pop{transform:translateY(-8px) scale(.94);opacity:0}
  .wkrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px}
  .week{display:flex;gap:5px}
  .day i{display:block;width:18px;height:7px;border-radius:4px;background:#E2DFD7}
  .day.on i{background:var(--pine)}
  .day.today i{box-shadow:0 0 0 2px rgba(30,75,58,.2)}
  .day.flash i{animation:flash .5s ease}
  @keyframes flash{0%{transform:scale(1)}45%{transform:scaleX(1.3)}100%{transform:scale(1)}}
  .day span{display:none}

  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  main.fixed{overflow:hidden}
  .pane{display:none;padding:16px 24px 18px}
  .pane.on{display:block}
  #p-add.on{display:flex;flex-direction:column;height:100%;padding:14px 24px 8px;overflow-y:auto}

  .ptrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .ptitle{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
  .psub{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
  .ptrow>div{min-width:0}
  .gear{flex:0 0 42px;height:42px;margin-top:4px;border-radius:50%;background:var(--surf);
    box-shadow:var(--sh);color:var(--ink-soft);display:grid;place-items:center}
  .gear:active{background:#F0EEE8}
  .ptrow:has(.psub){align-items:center}

  /* ══ 分类 ══ */
  .catbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .catbar b{font-size:12px;font-weight:500;color:var(--ink3)}
  .catbar button{font-size:12px;color:var(--ink-soft)}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:0 0 auto}
  .cats.row{grid-template-columns:repeat(3,1fr) 40px}
  .cat{background:var(--surf);border-radius:15px;padding:9px 2px;text-align:center;
    font-size:11.5px;color:var(--ink-soft);box-shadow:var(--sh);
    display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center}
  .cats.row .cat{flex-direction:row;gap:7px;padding:11px 2px;font-size:13px}
  .cat svg{width:19px;height:19px;stroke-width:1.7}
  .cat[aria-pressed="true"]{background:var(--pine);color:#fff;box-shadow:0 4px 12px rgba(30,75,58,.28)}
  .cat b{display:none}
  .more{background:var(--surf);border-radius:15px;box-shadow:var(--sh);color:var(--ink-soft);
    display:grid;place-items:center;font-size:16px;letter-spacing:1px}

  /* ══ chip 行 ══ */
  .quick,.opt{display:flex;gap:8px;margin:10px 0 0;flex:0 0 auto}
  .chip,.tog{padding:9px 16px;border-radius:999px;background:var(--surf);box-shadow:var(--sh);
    font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .tog{width:auto}
  .chip.on,.tog[aria-pressed="true"]{background:var(--pine);color:#fff;font-weight:500;box-shadow:0 3px 10px rgba(30,75,58,.25)}
  .xp{display:none;gap:8px;margin-top:9px;flex:0 0 auto}
  .xp.on{display:flex}
  .xp input,.xp select,.meta input{flex:1;font:inherit;color:inherit;background:var(--surf);
    border:0;box-shadow:var(--sh);border-radius:13px;padding:11px 14px;min-width:0}
  .meta{display:flex;gap:8px;margin:10px 0}

  /* ══ 键盘 + 确认长键 ══ */
  .padwrap{display:flex;gap:9px;flex:1 1 auto;min-height:0;margin-top:12px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(46px,1fr));
    gap:9px;flex:1 1 auto;min-height:0}
  .pad button{background:var(--surf);border-radius:18px;box-shadow:var(--sh);padding:0;
    font-size:25px;font-weight:500;display:grid;place-items:center;user-select:none}
  .pad button:active{background:#F0EEE8}
  .save{flex:0 0 82px;border-radius:18px;background:var(--pine);color:#fff;
    font-size:17px;font-weight:700;line-height:1.5;box-shadow:0 5px 16px rgba(30,75,58,.3);
    writing-mode:vertical-rl;letter-spacing:.28em;padding:0;display:grid;place-items:center}
  .save:disabled{background:#D8D5CC;color:#A8A69E;box-shadow:none}

  /* ══ 通用卡片 ══ */
  .card,.setup,.chk,.issue,.bk,.adv,.ok,.rep,.aibox,.dgroup{background:var(--surf);
    border-radius:20px;box-shadow:var(--sh)}
  .sec{font-size:12px;font-weight:500;color:var(--ink3);margin:22px 2px 9px}
  h3.sec{font-size:12px}
  .foot{font-size:11.5px;color:var(--ink3);line-height:1.65;padding:12px 2px 4px}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:52px 20px;line-height:1.75}
  .empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:7px;font-weight:600}
  .hint,.hintline{font-size:11.5px;color:var(--ink3);line-height:1.6;margin:0 0 14px}

  /* ══ 明细 ══ */
  .dgroup{margin-bottom:14px;padding:4px 16px 6px}
  .dhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
    color:var(--ink3);padding:12px 0 8px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;
    border-top:1px solid var(--line)}
  .dgroup .item:first-of-type{border-top:0}
  .dot{flex:0 0 34px;height:34px;border-radius:12px;display:grid;place-items:center}
  .dot svg{width:17px;height:17px;stroke-width:1.7}
  .item .t{flex:1;min-width:0}
  .item .t b{font-weight:500;font-size:14.5px}
  .item .t small{display:block;color:var(--ink3);font-size:11.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .item .v{font-weight:700;font-size:15px}
  .v.in{color:var(--teal)}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;
    background:var(--fill);color:var(--ink-soft);margin-left:6px;font-weight:400;vertical-align:1px}
  .badge.done{background:rgba(46,125,107,.13);color:var(--teal)}
  .badge.off{background:var(--fill);color:var(--ink3)}
  .rev{background:rgba(30,75,58,.07);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .rev h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--pine)}
  .rev p{margin:0 0 10px;font-size:12px;color:var(--ink-soft);line-height:1.6}
  .rev .cd{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(30,75,58,.12);font-size:13px}
  .rev .cd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rev .cd button{padding:6px 11px;border-radius:9px;background:var(--surf);font-size:12.5px;color:var(--ink-soft)}
  .rev .cd button.y{background:var(--pine);color:#fff}

  /* ══ 统计 ══ */
  .segsm{display:flex;gap:8px;margin-bottom:16px}
  .segsm button{flex:1;padding:9px;border-radius:13px;background:var(--surf);box-shadow:var(--sh);
    font-size:13px;color:var(--ink-soft)}
  .segsm button[aria-pressed="true"]{background:var(--pine);color:#fff;font-weight:600}
  .bud{background:var(--surf);border-radius:22px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
  .bud .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink3)}
  .bud .big{font-size:34px;font-weight:700;margin:6px 0 12px;letter-spacing:-.03em}
  .bud .gauge{height:10px;background:var(--fill);border-radius:6px;position:relative}
  .bud .gauge i{display:block;height:100%;background:var(--pine);border-radius:6px}
  .bud .gauge i.over{background:var(--clay)}
  .bud .mark{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.5}
  .bud .r2{font-size:12px;color:var(--ink3);margin-top:10px}
  .bud .set{display:flex;gap:8px;margin-top:14px}
  .bud .set input{flex:1;font:inherit;background:var(--fill);border:0;
    color:var(--ink);border-radius:12px;padding:10px 13px;min-width:0}
  .bud .set button{background:var(--pine);color:#fff;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px}
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mnav button{padding:7px 14px;border-radius:12px;background:var(--surf);box-shadow:var(--sh);font-size:14px;color:var(--ink-soft)}
  .total{font-size:36px;font-weight:700;margin:2px 0 4px;letter-spacing:-.03em}
  .bar{margin:14px 0}
  .bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .bar .l span:last-child{color:var(--ink3)}
  .track{height:7px;background:var(--fill);border-radius:4px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:4px}
  .cols{display:flex;align-items:flex-end;gap:2px;height:76px;margin:16px 0 6px}
  .cols i{flex:1;background:var(--pine);opacity:.7;border-radius:3px 3px 0 0;min-height:2px}
  .ytab{width:100%;border-collapse:collapse;font-size:13px}
  .ytab th{font-size:11.5px;font-weight:500;color:var(--ink3);padding:0 4px 9px;text-align:right}
  .ytab th:first-child{text-align:left}
  .ytab td{padding:8px 4px;text-align:right;border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ytab td:first-child{text-align:left;color:var(--ink3);font-size:12.5px}
  .ytab td.mx{font-weight:700}
  .ytab td.mx::after{content:'●';color:var(--pine);font-size:8px;vertical-align:super;margin-left:3px}
  .ytab tr.sum td{border-top:2px solid var(--ink);font-weight:700;padding-top:10px}
  .ytab td.z{color:#C8CBC3}

  /* ══ 轨迹 ══ */
  .trhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .trhead .yr{font-size:26px;font-weight:700;letter-spacing:-.03em}
  .trhead button{padding:8px 14px;border-radius:12px;background:var(--surf);box-shadow:var(--sh);
    font-size:13.5px;color:var(--ink-soft)}
  .trsum{display:flex;margin-bottom:16px}
  .trsum div{flex:1}
  .trsum span{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px}
  .trsum b{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .trsum b.in{color:var(--teal)}
  .trgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mo{background:var(--surf);border-radius:14px;box-shadow:var(--sh);padding:8px 7px 9px;
    text-align:left;width:100%;display:block}
  .mo.now{box-shadow:0 0 0 1.5px var(--pine),var(--sh)}
  .mo .mn{display:block;font-size:11px;color:var(--ink3);margin-bottom:6px}
  .mo.now .mn{color:var(--pine);font-weight:600}
  .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mg i{display:block;aspect-ratio:1;border-radius:2px;background:#E6E4DD}
  .mg i.o{background:none}
  .mg i.e{background:var(--clay)}
  .mg i.n{background:var(--teal)}
  .mg i.b{background:linear-gradient(135deg,var(--clay) 0 50%,var(--teal) 50% 100%)}
  .mg i.a{background:none;box-shadow:inset 0 0 0 1px #C4C7BE}
  .mg i.lt{opacity:.45}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;font-size:11px;color:var(--ink3)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:2px;display:block}
  .bg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
  .bg .wd{font-size:10.5px;color:var(--ink3);text-align:center;padding-bottom:3px}
  .bg button{aspect-ratio:1;border-radius:11px;background:var(--surf);box-shadow:var(--sh);
    font-size:12.5px;color:var(--ink-soft);display:grid;place-items:center}
  .bg button.o{background:none;box-shadow:none;pointer-events:none}
  .bg button.has{color:#fff;font-weight:600}
  .bg button.e{background:var(--clay)}
  .bg button.n{background:var(--teal)}
  .bg button.b{background:linear-gradient(135deg,var(--clay) 0 50%,var(--teal) 50% 100%)}
  .bg button.a{background:var(--surf);box-shadow:inset 0 0 0 1px #C4C7BE}
  .bg button.today{box-shadow:0 0 0 2px var(--pine)}
  .trend{margin-top:20px}
  .trend svg{width:100%;display:block}
  .trend .lg{display:flex;gap:16px;font-size:11.5px;color:var(--ink3);margin-top:6px}
  .trend .lg span{display:flex;align-items:center;gap:5px}
  .trend .lg i{width:14px;height:2px;display:block;border-radius:2px}
  .dayhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .dayhd b{font-size:20px;font-weight:700}

  /* ══ 资金 ══ */
  .cashcard{background:var(--pine);color:#fff;border-radius:24px;padding:20px 22px 18px;
    margin-bottom:16px;box-shadow:0 6px 22px rgba(30,75,58,.26);width:100%;text-align:left;display:block}
  .cashcard .lb{font-size:12.5px;color:rgba(255,255,255,.62)}
  .cashcard .big{font-size:42px;font-weight:700;margin:6px 0 2px;letter-spacing:-.035em}
  .cashcard .big.neg{color:#F0B3A3}
  .cashcard .ln{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:rgba(255,255,255,.66)}
  .cashcard .ln.tot{border-top:1px solid rgba(255,255,255,.2);margin-top:7px;padding-top:10px;
    font-weight:700;color:#fff;font-size:14.5px}
  .cashcard .brk{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
  .cashcard .hint{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:10px;line-height:1.6}
  .cashcard .set{display:flex;gap:8px;margin-top:14px}
  .cashcard .set input{flex:1;font:inherit;background:rgba(255,255,255,.14);border:0;
    color:#fff;border-radius:12px;padding:10px 13px;min-width:0}
  .cashcard .set input::placeholder{color:rgba(255,255,255,.45)}
  .cashcard .set button{background:#fff;color:var(--pine);border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px}
  .split{display:flex;gap:2px;height:13px;margin:6px 0 16px}
  .split i{display:block;height:100%;border-radius:7px}
  .bk{padding:15px 18px;margin-bottom:10px}
  .bk .t{display:flex;align-items:center;gap:10px}
  .bk .t b{flex:1;font-size:15px;font-weight:700}
  .bk .t .amt{font-size:16px;font-weight:700}
  .bk .pc{display:flex;align-items:center;gap:8px;margin-top:10px}
  .bk .pc input{width:58px;font:inherit;background:var(--fill);border:0;
    border-radius:10px;padding:7px 9px;text-align:right}
  .bk .pc span{font-size:12px;color:var(--ink3);flex:1}
  .bk .pc button{padding:7px 11px;border-radius:10px;background:var(--fill);font-size:12px;color:var(--ink-soft)}
  .bk .goal{margin-top:11px}
  .bk .goal .gl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:5px}
  .warnbar{background:rgba(179,69,60,.1);color:var(--danger);border-radius:13px;
    padding:10px 14px;font-size:12.5px;margin-bottom:12px}
  .bigbtn{width:100%;padding:15px;border-radius:16px;background:var(--pine);color:#fff;
    font-size:15.5px;font-weight:700;margin-bottom:10px;box-shadow:0 4px 14px rgba(30,75,58,.25)}
  .bigbtn.ghost{background:var(--surf);color:var(--ink-soft);font-weight:500;box-shadow:var(--sh)}
  .setup{padding:16px 18px;margin-top:10px}
  .setup label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  .setup small{display:block;color:var(--ink3);font-size:11.5px;line-height:1.65;margin-bottom:12px}
  .setup .row{display:flex;gap:8px}
  .setup input{flex:1;font:inherit;background:var(--fill);border:0;border-radius:12px;padding:10px 13px;min-width:0}
  .setup .row button{background:var(--pine);color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow button{flex:1;padding:12px 6px;border-radius:12px;background:var(--fill);font-size:13.5px;color:var(--ink)}
  .btnrow button.pri{background:var(--pine);color:#fff;font-weight:600}

  /* ══ 设置 ══ */
  .backrow{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
  .glist{background:var(--surf);border-radius:20px;box-shadow:var(--sh);padding:0 18px}
  .grow{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left}
  .glist .grow:first-child{border-top:0}
  .grow .gn{flex:1;font-size:14.5px;font-weight:500}
  .grow .gv{font-size:13px;color:var(--ink3)}
  .sw{flex:0 0 44px;height:26px;border-radius:13px;background:#DEDBD3;position:relative;transition:background .16s}
  .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .sw.on{background:var(--pine)}
  .sw.on i{transform:translateX(18px)}
  /* ══ 体检 ══ */
  .verdict{border-radius:24px;padding:20px 20px 18px;margin-bottom:18px;
    background:var(--surf);box-shadow:var(--sh-lg)}
  .verdict .lamp{font-size:12px;color:var(--ink3);margin-bottom:9px}
  .verdict h2{margin:0 0 10px;font-size:23px;font-weight:700;letter-spacing:-.02em}
  .verdict p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  .verdict .when{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink3)}

<script>
/* 存储：IndexedDB 为正式存储，localStorage 仅在 IndexedDB 不可用时降级使用。
   两者不会同时写入——SS.mode 决定唯一的写入目标。 */
const KEY='ledger:v1';
const CATS={
  expense:[
    {k:'food',n:'餐饮',e:'🍜',c:'#D4703B'},{k:'trans',n:'交通',e:'🚇',c:'#4C7FA8'},
    {k:'daily',n:'日用',e:'🧴',c:'#7A9E6E'},{k:'shop',n:'购物',e:'🛍',c:'#B45E86'},
    {k:'fun',n:'娱乐',e:'🎮',c:'#8A6FBF'},{k:'med',n:'医疗',e:'💊',c:'#4FA3A0'},
    {k:'home',n:'住房',e:'🏠',c:'#A8813F'},{k:'phone',n:'通讯',e:'📱',c:'#6B7B8C'},
    {k:'sub',n:'订阅',e:'📺',c:'#5E7F9E'},{k:'repay',n:'还款',e:'💳',c:'#9B5C4E'},
    {k:'gift',n:'人情',e:'🧧',c:'#C05A5A'},{k:'other',n:'其他',e:'📦',c:'#8C8C86'}
  ],
  income:[
    {k:'salary',n:'工资',e:'💼',c:'#2E7D5B'},{k:'side',n:'外快',e:'🔧',c:'#4C7FA8'},
    {k:'bonus',n:'奖金',e:'🎯',c:'#A8813F'},{k:'reim',n:'报销',e:'🧾',c:'#7A9E6E'},
    {k:'redp',n:'红包',e:'🧧',c:'#C05A5A'},{k:'other_i',n:'其他',e:'📥',c:'#8C8C86'}
  ]
};
/* 自动标签规则：用户可在明细里逐笔覆盖 */
const RULE={food:{need:1},trans:{need:1},daily:{need:1},med:{need:1},
  home:{fixed:1,need:1},phone:{fixed:1,need:1},sub:{fixed:1},
  repay:{fixed:1,need:1,debt:1},shop:{},fun:{},gift:{},other:{}};
const STABLE=['salary','side'];
const TAGS=[['fixed','固定支出'],['need','必要支出'],['once','一次性'],['debt','债务还款']];

/* 自绘单线图标：替代 emoji，各机型长相一致 */
const ICON={
 food:'<path d="M4 11h16"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M9 4v4M12.5 3v5"/>',
 trans:'<rect x="4" y="5" width="16" height="11" rx="3"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/>',
 daily:'<path d="M10 3h4v3h-4z"/><rect x="8" y="6" width="8" height="15" rx="2.5"/>',
 shop:'<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
 fun:'<rect x="3" y="8" width="18" height="9" rx="4.5"/><circle cx="8" cy="12.5" r="1.3"/><circle cx="16" cy="12.5" r="1.3"/>',
 med:'<path d="M12 5v14M5 12h14"/>',
 home:'<path d="M4 11l8-7 8 7"/><path d="M6.5 11v9h11v-9"/>',
 phone:'<rect x="7.5" y="2.5" width="9" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
 sub:'<rect x="3" y="5" width="18" height="13" rx="3"/><path d="M11 10l4 2.5-4 2.5z"/>',
 repay:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10.5h18"/>',
 gift:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M3.5 10V8h17v2M12 8v12"/><path d="M12 8s-1-3-3-3-2.5 3 0 3"/>',
 other:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
 salary:'<rect x="3" y="7" width="18" height="12" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>',
 side:'<path d="M15 4a5 5 0 0 0-6.5 6.5L4 15l5 5 4.5-4.5A5 5 0 0 0 20 9"/>',
 bonus:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/>',
 reim:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/>',
 redp:'<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 6.5L12 13l8.5-6.5"/>',
 other_i:'<path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M4 13l2.5-8h11L20 13v6H4z"/>'};
const ico=(k,sz)=>`<svg viewBox="0 0 24 24" width="${sz||20}" height="${sz||20}" fill="none"
  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||ICON.other}</svg>`;
const GEAR=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/>
  <path d="M12 2.8v2.6M12 18.6v2.6M4.5 4.5l1.9 1.9M17.6 17.6l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.5 19.5l1.9-1.9M17.6 6.4l1.9-1.9"/></svg>`;
/* 页面标题栏：右侧常驻设置入口，四个页面都有 */
const ptitle=(t,sub)=>`<div class="ptrow"><div><div class="ptitle">${t}</div>`
  +(sub?`<div class="psub">${sub}</div>`:'')+`</div>`
  +(t==='设置'?'':`<button class="gear" data-gear="1">${GEAR}</button>`)+`</div>`;
const catOf=k=>[...CATS.expense,...CATS.income].find(c=>c.k===k)||{n:'其他',e:'📦',c:'#8C8C86'};
const pad2=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const money=n=>(Math.round(n*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d)\.)/g,',');
const yuan=n=>'¥'+money(n);
const pct=n=>Math.round(n*100)+'%';
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+y.amount,0);

/* ── 资金性质 ──
   type 只表示现金方向；nature 区分性质，缺省即"真实收支"，老数据零改动。
   nature: undefined 真实 | 'adv' 垫付 | 'reim' 报销到账
   gid: 垫付=自身 id；报销=所关联垫付的 id（空=无主报销）
   off: 报销失败，转为个人支出的原因                                   */
const isRealExp=r=>r.type==='expense'&&(!r.nature||(r.nature==='adv'&&!!r.off));
const isRealInc=r=>r.type==='income'&&!r.nature;
const isAdv=r=>r.nature==='adv'&&!r.off;
function advInfo(a){
  const got=sum(records.filter(r=>r.nature==='reim'&&r.gid===a.id));
  return {got,left:a.off?0:Math.max(a.amount-got,0),
    st:a.off?'off':got>=a.amount?'done':got>0?'partial':'pending'};
}
const advOpen=()=>records.filter(isAdv).map(a=>Object.assign({a},advInfo(a))).filter(x=>x.left>0)
  .sort((x,y)=>x.a.date.localeCompare(y.a.date));
const owed=()=>advOpen().reduce((s,x)=>s+x.left,0);
const KW=/垫|报销|出差|差旅|公司|客户|代付|备用金|驻场|项目/;
const advCands=()=>records.filter(r=>r.type==='expense'&&!r.nature&&!r.nadv&&KW.test(r.note||''));

/* 资金桶默认值。必要支出与应急储备不在这里——它们在"可支配资金"之上就已经扣掉，
   放进桶会把同一笔钱算两次。 */
const DEFBK=[{id:'b_save',name:'储蓄',emoji:'🏦',pct:40},
  {id:'b_inv',name:'投资',emoji:'📈',pct:20},
  {id:'b_free',name:'自由消费',emoji:'🎈',pct:30},
  {id:'b_spare',name:'备用',emoji:'🧰',pct:10}];
const DEFSET={needMo:1,reserveMo:3};

let lock={on:false};
let records=[], budget=0, cashBase=0, cashAt='', cashTs=0, migrated=0,
    buckets=[], allocs=[], settings=Object.assign({},DEFSET),
    type='expense', cat=null, raw='', advOn=false;

/* 现金不再手填：填一次基准余额，之后按流水自动加减。
   现金方向就是 type，垫付/报销同样影响余额。 */
/* 哪些流水算在基准之后：
   日期晚于基准日 → 一定算；
   日期就是基准日 → 看是校准之前记的还是之后记的（靠 ts 判断）；
   日期早于基准日 → 已经反映在你填的余额里，不能再扣一遍。 */
const afterBase=r=>r.date>cashAt
  ||(r.date===cashAt&&(!cashTs||r.ts>cashTs));   /* 没有精确时刻的老数据：当天全部计入 */
const flowSince=()=>records.filter(afterBase)
  .reduce((s,r)=>s+(r.type==='income'?r.amount:-r.amount),0);
const cashNow=()=>cashBase+(cashAt?flowSince():0);
const bkOf=id=>buckets.find(b=>b.id===id);
const bkBal=id=>allocs.filter(a=>a.bid===id).reduce((s,a)=>s+a.amount,0)
  -records.filter(r=>r.bk===id&&r.type==='expense').reduce((s,r)=>s+r.amount,0);
const bkTotal=()=>buckets.reduce((s,b)=>s+bkBal(b.id),0);
const pctSum=()=>buckets.reduce((s,b)=>s+(+b.pct||0),0);

/* ══════ 存储层：IndexedDB 优先，localStorage 仅作降级，两者不混用 ══════ */
const DB_NAME='expenseBook', DB_VERSION=1;

/* 运行状态，只给「数据保护」区展示，不参与业务计算 */
const SS={mode:'init',err:'',persist:'unknown',lastSaved:'',migration:'',dbCount:0,justFailed:0};
let idb=null, snapTx=new Map(), snapAl=new Map(), snapCfg='';
const cfgNow=()=>JSON.stringify({budget,cashBase,cashAt,cashTs,migrated,buckets,settings,lock});

const txDone=t=>new Promise((res,rej)=>{
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
  t.onabort=()=>rej(t.error||new Error('事务被中止'));});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});

function openDB(){
  if(typeof indexedDB==='undefined'||!indexedDB) return Promise.reject(new Error('浏览器不支持 IndexedDB'));
  return new Promise((res,rej)=>{
    const o=indexedDB.open(DB_NAME,DB_VERSION);
    o.onupgradeneeded=e=>{
      const d=o.result;
      /* 以后升级版本时在这里按 e.oldVersion 逐级补充，不要重建已有 store */
      if(e.oldVersion<1){
        d.createObjectStore('transactions',{keyPath:'id'}).createIndex('date','date');
        d.createObjectStore('allocs',{keyPath:'id'});
        d.createObjectStore('settings',{keyPath:'k'});
        d.createObjectStore('meta',{keyPath:'k'});
      }
    };
    o.onsuccess=()=>res(o.result);
    o.onerror=()=>rej(o.error||new Error('打开数据库失败'));
    o.onblocked=()=>rej(new Error('数据库被另一个标签页占用'));
  });
}
const allOf=n=>rq(idb.transaction(n,'readonly').objectStore(n).getAll());
const countOf=n=>rq(idb.transaction(n,'readonly').objectStore(n).count());
const kvGet=async(n,k)=>{const v=await rq(idb.transaction(n,'readonly').objectStore(n).get(k));
  return v?v.v:undefined;};
async function kvPut(n,k,v){const t=idb.transaction(n,'readwrite');
  t.objectStore(n).put({k,v}); await txDone(t);}

function banner(html){const b=$('#banner'); if(!b) return; b.innerHTML=html; b.classList.add('on');}
function clearBanner(){const b=$('#banner'); if(b) b.classList.remove('on');}

/* 旧 localStorage 数据：只读，永不删除 */
function readLS(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){ return null; }
  if(!raw) return null;
  try{ const d=JSON.parse(raw); return Array.isArray(d.records)?d:'bad'; }
  catch(e){ return 'bad'; }
}
const cfgFrom=d=>({budget:d.budget||0,
  cashBase:d.cashBase!==undefined?d.cashBase:(d.cash||0), cashAt:d.cashAt||'',
  cashTs:d.cashTs||0, migrated:d.migrated||0, buckets:d.buckets||[],
  settings:d.settings||{}, lock:d.lock||{on:false}});

/* ── 迁移：逐条校验，旧数据一律保留 ── */
async function migrate(){
  const done=await kvGet('meta','migrationDone');
  const have=await countOf('transactions');
  const ls=readLS();
  if(done){ SS.migration=`已迁移（${String(done.at).slice(0,10)}，来源 ${done.from}）`; return true; }
  if(ls==='bad'){
    SS.migration='旧数据解析失败，已原样保留未做改动';
    banner('<b>旧账本数据读不出来</b>localStorage 里的内容无法解析，已原样保留、一个字没动。新账目会存进 IndexedDB。先不要清除浏览器数据。');
    await kvPut('meta','migrationDone',{at:new Date().toISOString(),from:'ls-unparsable',count:have});
    return true;
  }
  if(!ls){
    SS.migration=have?`沿用库中已有 ${have} 条`:'新安装，无需迁移';
    await kvPut('meta','migrationDone',{at:new Date().toISOString(),from:have?'idb-existing':'fresh',count:have});
    return true;
  }
  /* 有旧数据：按 id 并集写入，不删 IndexedDB 里任何已有记录 */
  const src=ls.records.filter(r=>r&&r.id);
  const t=idb.transaction(['transactions','allocs','settings'],'readwrite');
  src.forEach(r=>t.objectStore('transactions').put(r));
  (ls.allocs||[]).filter(a=>a&&a.id).forEach(a=>t.objectStore('allocs').put(a));
  if(!have) t.objectStore('settings').put({k:'config',v:cfgFrom(ls)});
  await txDone(t);

  /* 回读校验：数量 + 逐条关键字段 */
  const back=await allOf('transactions');
  const kf=r=>[r.id,r.date,r.amount,r.cat,r.type].join('|');
  const bm=new Map(back.map(r=>[r.id,kf(r)]));
  const missing=src.filter(r=>!bm.has(r.id));
  const bad=src.filter(r=>bm.get(r.id)!==kf(r));
  if(missing.length||bad.length||back.length<src.length){
    await kvPut('meta','migrationError',{at:new Date().toISOString(),
      srcCount:src.length,dbCount:back.length,missing:missing.length,bad:bad.length});
    SS.migration=`迁移校验未通过（源 ${src.length} / 库 ${back.length}，缺 ${missing.length}、字段不符 ${bad.length}），已降级回 localStorage`;
    return false;
  }
  await kvPut('meta','migrationDone',{at:new Date().toISOString(),
    from:have?'localStorage+库中已有数据合并':'localStorage', count:back.length, srcCount:src.length});
  SS.migration=`已从 localStorage 迁入 ${src.length} 条，逐条校验通过`
    +(back.length>src.length?`（另有 ${back.length-src.length} 条原本已在库中，一并保留）`:'');
  return true;
}

async function loadFromStore(){
  let d;
  if(SS.mode==='idb'){
    records=await allOf('transactions');
    allocs=await allOf('allocs');
    d=(await kvGet('settings','config'))||{};
    SS.lastSaved=(await kvGet('meta','lastSaved'))||'';
    SS.dbCount=records.length;
  }else{
    const ls=readLS();
    d=(ls&&ls!=='bad')?ls:{};
    records=d.records||[]; allocs=d.allocs||[];
  }
  budget=d.budget||0; migrated=d.migrated||0;
  cashBase=d.cashBase!==undefined?d.cashBase:(d.cash||0);
  cashAt=d.cashAt||''; cashTs=d.cashTs||0;
  buckets=(d.buckets&&d.buckets.length)?d.buckets:DEFBK.map(b=>Object.assign({},b));
  settings=Object.assign({},DEFSET,d.settings||{});
  lock=d.lock||{on:false};
  /* 已持久化状态的内存快照：写失败时靠它回滚，不需要再访问数据库 */
  snapTx=new Map(records.map(r=>[r.id,JSON.stringify(r)]));
  snapAl=new Map(allocs.map(a=>[a.id,JSON.stringify(a)]));
  snapCfg=cfgNow();
}

/* ── 写入：只写变化的记录，等事务真正完成才算成功 ── */
async function save(){
  if(SS.mode==='ls'){
    try{ localStorage.setItem(KEY,JSON.stringify(
      {records,budget,cashBase,cashAt,cashTs,migrated,buckets,allocs,settings,lock}));
      SS.lastSaved=new Date().toISOString();
      snapTx=new Map(records.map(r=>[r.id,JSON.stringify(r)]));
      snapAl=new Map(allocs.map(a=>[a.id,JSON.stringify(a)]));
      snapCfg=cfgNow(); SS.justFailed=0; return true;
    }catch(e){ saveFailed(e); return false; }
  }
  if(SS.mode!=='idb'){ saveFailed(new Error('存储不可用')); return false; }
  try{
    const t=idb.transaction(['transactions','allocs','settings','meta'],'readwrite');
    const ts=t.objectStore('transactions'), as=t.objectStore('allocs');
    const cur=new Map(records.map(r=>[r.id,JSON.stringify(r)]));
    cur.forEach((j,id)=>{ if(snapTx.get(id)!==j) ts.put(JSON.parse(j)); });
    snapTx.forEach((_,id)=>{ if(!cur.has(id)) ts.delete(id); });
    const ca=new Map(allocs.map(a=>[a.id,JSON.stringify(a)]));
    ca.forEach((j,id)=>{ if(snapAl.get(id)!==j) as.put(JSON.parse(j)); });
    snapAl.forEach((_,id)=>{ if(!ca.has(id)) as.delete(id); });
    t.objectStore('settings').put({k:'config',
      v:{budget,cashBase,cashAt,cashTs,migrated,buckets,settings,lock}});
    const now=new Date().toISOString();
    t.objectStore('meta').put({k:'lastSaved',v:now});
    await txDone(t);
    snapTx=cur; snapAl=ca; snapCfg=cfgNow(); SS.lastSaved=now; SS.dbCount=records.length;
    SS.justFailed=0;
    if(SS.err){ SS.err=''; clearBanner(); }
    return true;
  }catch(e){ saveFailed(e); return false; }
}
/* 写失败：不谎报成功。从内存快照回滚，不访问数据库——
   库坏掉时读操作也可能失败，回滚本身不能依赖它。 */
function saveFailed(e){
  SS.err=(e&&e.message)||'写入失败';
  SS.justFailed=Date.now();   /* 让随后的 toast('已保存') 闭嘴，调用方不必逐个改 */
  banner(`<b>这一步没有保存成功</b>${SS.err}。界面已回滚到上次保存的状态，刚才的改动没有写进账本。`);
  try{
    records=[...snapTx.values()].map(j=>JSON.parse(j));
    allocs=[...snapAl.values()].map(j=>JSON.parse(j));
    if(snapCfg){ const c=JSON.parse(snapCfg);
      budget=c.budget;cashBase=c.cashBase;cashAt=c.cashAt;cashTs=c.cashTs||0;migrated=c.migrated;
      buckets=c.buckets;settings=c.settings;lock=c.lock; }
    renderAll();
  }catch(_){}
}

async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist){ SS.persist='unsupported'; return; }
    let p=await navigator.storage.persisted();
    if(!p){
      await navigator.storage.persist();
      p=await navigator.storage.persisted();   /* 以实际状态为准，不信请求的返回值 */
    }
    SS.persist=p?'granted':'normal';
  }catch(e){ SS.persist='unsupported'; }
}

async function boot(){
  try{
    idb=await openDB();
    SS.mode='idb';
    if(!await migrate()){
      SS.mode='ls';
      banner('<b>迁移校验没通过，已降级</b>继续使用原来的 localStorage 存储，账目一条没动。详情见右上角设置。');
    }
  }catch(e){
    SS.mode=readLS()?'ls':'none';
    SS.err=(e&&e.message)||'IndexedDB 打开失败';
    banner(SS.mode==='ls'
      ? `<b>IndexedDB 不可用，已降级</b>${SS.err}。正在使用原来的 localStorage，账目照常读写。`
      : `<b>存储不可用</b>${SS.err}。现在的空账本不代表数据丢失，先不要重复记账。`);
  }
  try{ await loadFromStore(); }
  catch(e){ banner(`<b>读取账本失败</b>${(e&&e.message)||e}。现在的空账本不代表数据丢失，请不要在此状态下记账。`); }
  if(cashAt&&!cashTs){
    /* 老数据只有基准日、没有精确时刻。补成当天 0 点，
       这样基准日当天的账会被计入——宁可多扣也不漏扣，
       用户看到对不上会去重新校准。 */
    cashTs=new Date(cashAt+'T00:00:00').getTime()||1;
    await save();
  }
  if(!migrated){
    let n=0;
    records.forEach(r=>{ if(r.type==='income'&&r.cat==='reim'&&!r.nature){r.nature='reim';r.gid='';n++;} });
    migrated=1; await save();
    if(n) setTimeout(()=>toast(`已把 ${n} 笔历史报销移出真实收入`),600);
  }
  await askPersist();
  if(lock.on) showLock();
  renderAll();
}

/* ── 标签判定 ── */
let catAvg={},allAvg=0;
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),i=s.length>>1;
  return s.length%2?s[i]:(s[i-1]+s[i])/2;};
function calcAvg(){
  /* 用中位数当基准：均值会被要检测的那笔大额自己拉高，导致漏判 */
  const exp=records.filter(isRealExp);
  allAvg=med(exp.map(r=>r.amount)); catAvg={};
  const g={}; exp.forEach(r=>(g[r.cat]=g[r.cat]||[]).push(r.amount));
  for(const k in g) catAvg[k]=g[k].length>=3?med(g[k]):null;
}
function flags(r){
  const f=Object.assign({fixed:0,need:0,debt:0,once:0},RULE[r.cat]||{});
  if(!f.fixed){
    const base=catAvg[r.cat]||allAvg||r.amount;
    if(r.amount>=300&&r.amount>=base*4) f.once=1;
  }
  return Object.assign(f,r.ov||{});
}
const isStable=r=>r.ov&&'once'in r.ov?!r.ov.once:STABLE.includes(r.cat);

/* ── 顶部 ── */
function streakDays(){
  const s=new Set(records.map(r=>r.date)); const d=new Date(); let n=0;
  if(!s.has(key(d))) d.setDate(d.getDate()-1);
  while(s.has(key(d))){n++;d.setDate(d.getDate()-1);} return n;
}

  const ym=today.slice(0,7);

    const d=new Date(); d.setDate(d.getDate()-(6-i)); const k=key(d);

  }).join('');
}

/* ── 记一笔 ── */

/* 常用分类排前面，但只在进入本页时算一次，连续记账时按钮不跳位 */
function orderedCats(){
  if(type!=='expense') return CATS.income;
  if(!catOrder){
    const d=new Date(); d.setDate(d.getDate()-30); const since=key(d), n={};
    records.filter(r=>r.type==='expense'&&r.date>=since).forEach(r=>n[r.cat]=(n[r.cat]||0)+1);
    catOrder=[...CATS.expense].sort((a,b)=>(n[b.k]||0)-(n[a.k]||0));

$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('');

  const cd=advCands();
  const rev=cd.length?`<div class="rev"><h4>这 ${cd.length} 笔备注像工作垫付</h4>
    <p>只是按备注关键词挑出来的候选，没有改动任何数据。确认后它们会移出个人消费，转为待报销。</p>`+
    cd.slice(0,6).map(r=>`<div class="cd"><span>${r.date.slice(5)} ${catOf(r.cat).n} ${yuan(r.amount)} · ${r.note}</span>
      <button class="y" data-adv="${r.id}">是垫付</button><button data-nadv="${r.id}">不是</button></div>`).join('')+'</div>':'';
  el.innerHTML=ptitle('明细')+rev+Object.entries(by).map(([d,rs])=>{
    const out=sum(rs.filter(isRealExp));
    const label=d===today?'今天':d===key(y)?'昨天':d.slice(5).replace('-','月')+'日';
    return `<div class="dgroup"><div class="dhead"><span>${label}</span><span class="num">支出 ${yuan(out)}</span></div>`+
      rs.map(itemHTML).join('')+'</div>';
  }).join('');
}
/* 明细条目：轨迹的当天视图复用同一份渲染，点击后打开同一个弹层 */
function itemHTML(r){
  const c=catOf(r.cat), f=flags(r);
  let bd='';
  if(r.nature==='adv'){const i=advInfo(r);
    bd=`<span class="badge ${i.st==='done'?'done':i.st==='off'?'off':''}">${
      i.st==='done'?'已报销':i.st==='off'?'自己承担':i.st==='partial'?'待收 '+yuan(i.left):'待报销'}</span>`;}
  else if(r.nature==='reim') bd='<span class="badge">报销到账</span>';
  if(r.bk&&bkOf(r.bk)) bd+=`<span class="badge">${bkOf(r.bk).emoji}${bkOf(r.bk).name}</span>`;
  const mk=[f.fixed&&'固定',f.once&&'一次性',f.debt&&'还款'].filter(Boolean).join(' · ');
  return `<button class="item" data-id="${r.id}">
    <span class="dot" style="background:${c.c}18;color:${c.c}">${ico(r.cat,17)}</span>
    <span class="t"><b>${c.n}${bd}</b><small>${r.note||mk||'—'}${r.note&&mk?' · '+mk:''}</small></span>
    <span class="v num ${r.type==='income'?'in':''}">${r.type==='income'?'+':'−'}${money(r.amount)}</span></button>`;
}
let pending=null;
$('#p-list').onclick=async e=>{
  const yes=e.target.closest('[data-adv]'), no=e.target.closest('[data-nadv]');
  if(yes||no){
    const id=(yes||no).dataset.adv||(no).dataset.nadv;
    const r=records.find(x=>x.id===id); if(!r) return;
    if(yes){r.nature='adv';r.gid=r.id;} else r.nadv=1;
    await save(); renderAll(); toast(yes?'已转为垫付':'知道了');
    return;
  }
  const b=e.target.closest('.item'); if(!b) return;
  pending=records.find(r=>r.id===b.dataset.id); if(!pending) return;
  openSheet();
};
const OFFR=['公司不予报销','超出报销额度','我主动承担','其他'];
function openSheet(mode){
  const r=pending,c=catOf(r.cat),f=flags(r);
  $('#bkWrap').innerHTML='';
  $('#shDesc').textContent=`${r.date} · ${c.n} ${yuan(r.amount)}${r.note?' · '+r.note:''}`;
  $('#acts').innerHTML='<button id="shCancel">关闭</button><button class="del" id="shDel">删除</button>';

    }else{
      $('#shTags').innerHTML='';
      $('#shHint').innerHTML=r.off?`已按「${r.off}」转为个人支出，计入真实消费。`

      `</div><p class="hintline">指定后这笔会从该方向的余额里扣掉。日常消费不用管，买目标物品时再指定。</p>`:'';

    const b=e.target.closest('[data-bk]'); if(!b||!pending) return;

function bindSheet(){
  $('#shCancel').onclick=()=>{$('#sheet').classList.remove('on');pending=null;};
  $('#shDel').onclick=async()=>{

    $('#sheet').classList.remove('on'); pending=null; await save(); renderAll(); toast('已记为收回');
  };

$('#shTags').onclick=async e=>{

/* ── 统计 ── */
let mOff=0, statMode='month', yMetric='exp';
function renderStat(){
  if(statMode==='year') return renderYear();
  if(statMode==='track') return renderTrack();
  renderMonth();
}
const segStat=()=>ptitle('统计')+`<div class="segsm">
  <button data-sm="month" aria-pressed="${statMode==='month'}">按月</button>
  <button data-sm="year" aria-pressed="${statMode==='year'}">年度对比</button>
  <button data-sm="track" aria-pressed="${statMode==='track'}">轨迹</button></div>`;
function bindSeg(){
  $('#p-stat').querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{
    statMode=b.dataset.sm; renderStat();
  });
}

/* 年度对比：12 行 × 最近几年，一眼看同月份跨年差异 */
function renderYear(){
  const ys=[...new Set(records.map(r=>r.date.slice(0,4)))].sort();
  if(!ys.length){
    $('#p-stat').innerHTML=segStat()+'<div class="empty"><b>还没有数据</b>记几笔之后这里会出现逐月对比</div>';
    bindSeg(); return;
  }
  const cols=ys.slice(-3);
  const cell={};   // cell[年][月] = {inc,exp}
  cols.forEach(y=>{cell[y]={}; for(let m=1;m<=12;m++) cell[y][m]={inc:0,exp:0};});
  records.forEach(r=>{
    const y=r.date.slice(0,4), m=+r.date.slice(5,7);
    if(!cell[y]) return;
    if(isRealInc(r)) cell[y][m].inc+=r.amount;
    else if(isRealExp(r)) cell[y][m].exp+=r.amount;
  });
  const val=(y,m)=>{const c=cell[y][m];
    return yMetric==='inc'?c.inc:yMetric==='exp'?c.exp:c.inc-c.exp;};
  const mxOf={};   // 每年支出最多的月份
  cols.forEach(y=>{let b=0,bm=0; for(let m=1;m<=12;m++) if(cell[y][m].exp>b){b=cell[y][m].exp;bm=m;} mxOf[y]=bm;});
  const tot=y=>{let i=0,e=0; for(let m=1;m<=12;m++){i+=cell[y][m].inc;e+=cell[y][m].exp;}
    return yMetric==='inc'?i:yMetric==='exp'?e:i-e;};
  const short=n=>!n?'—':Math.abs(n)>=10000?(n/10000).toFixed(2).replace(/\.?0+$/,'')+'万'
    :Math.round(n).toLocaleString('en-US');

  let rows='';
  for(let m=1;m<=12;m++){
    rows+=`<tr><td>${m} 月</td>`+cols.map(y=>{
      const v=val(y,m), hot=yMetric==='exp'&&mxOf[y]===m&&v>0;
      return `<td class="${hot?'mx':''} ${v?'':'z'}">${short(v)}</td>`;
    }).join('')+'</tr>';
  }
  const ex=cols.map(y=>({y,v:tot(y)}));
  let note='';
  if(cols.length>1){
    const hi=ex.reduce((a,b)=>b.v>a.v?b:a), lo=ex.reduce((a,b)=>b.v<a.v?b:a);
    const nm={inc:'收入',exp:'支出',bal:'结余'}[yMetric];
    note=`${hi.y} 年${nm}最多（${yuan(hi.v)}），${lo.y} 年最少（${yuan(lo.v)}）。`;
  }
  const last=cols[cols.length-1];
  if(yMetric==='exp'&&mxOf[last]) note+=`${last} 年里 ${mxOf[last]} 月支出最高。`;

  $('#p-stat').innerHTML=segStat()+`
    <div class="segsm">
      <button data-ym="exp" aria-pressed="${yMetric==='exp'}">支出</button>
      <button data-ym="inc" aria-pressed="${yMetric==='inc'}">收入</button>
      <button data-ym="bal" aria-pressed="${yMetric==='bal'}">结余</button>
    </div>
    <table class="ytab"><thead><tr><th></th>${cols.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
    <tbody>${rows}
      <tr class="sum"><td>全年</td>${cols.map(y=>`<td>${short(tot(y))}</td>`).join('')}</tr>
    </tbody></table>
    ${note?`<div class="foot">${note}${yMetric==='exp'?' 金点标的是该年支出最高的月份。':''}
      垫付和报销不计入，只算真实收支。</div>`:
      '<div class="foot">只有一年的数据，攒够两年就能横向比了。垫付和报销不计入。</div>'}`;
  bindSeg();
  $('#p-stat').querySelectorAll('[data-ym]').forEach(b=>b.onclick=()=>{yMetric=b.dataset.ym;renderYear();});
}

function renderMonth(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()-mOff);
  const ym=base.getFullYear()+'-'+pad2(base.getMonth()+1);
  const rs=records.filter(r=>r.date.startsWith(ym));
  const out=rs.filter(isRealExp),total=sum(out),income=sum(rs.filter(isRealInc));
  const advM=sum(rs.filter(isAdv));
  const days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const now=new Date(),cur=ym===key(now).slice(0,7),past=cur?now.getDate():days;
  const s={}; out.forEach(r=>s[r.cat]=(s[r.cat]||0)+r.amount);
  const rank=Object.entries(s).sort((a,b)=>b[1]-a[1]);
  const daily=[...Array(days)].map((_,i)=>sum(out.filter(r=>+r.date.slice(8)===i+1)));
  const mx=Math.max(...daily,1);
  let bud='';
  if(cur){
    const fc=total/past*days;
    bud=budget>0?`<div class="bud"><div class="r1"><span>本月预算 ${yuan(budget)}</span><span class="num">第 ${past} / ${days} 天</span></div>
      <div class="big num">已花 ${yuan(total)}</div>
      <div class="gauge"><i class="${total>budget?'over':''}" style="width:${Math.min(total/budget*100,100)}%"></i>
      <span class="mark" style="left:${past/days*100}%"></span></div>
      <div class="r2 num">白线是时间进度 · ${total>budget?'超出 '+yuan(total-budget)
        :'剩 '+yuan(budget-total)+(days>past?` · 后 ${days-past} 天每天 ${yuan((budget-total)/(days-past))}`:'')}</div>
      <div class="set"><input type="number" inputmode="decimal" id="budIn" placeholder="改成…"><button id="budSet">保存</button></div></div>`
      :`<div class="bud"><div class="r1"><span>本月已花</span><span class="num">第 ${past} / ${days} 天</span></div>
      <div class="big num">${yuan(total)}</div>
      <div class="r2">按现在的速度，月底大约 ${yuan(fc)}。设个预算，这里会变成进度条。</div>
      <div class="set"><input type="number" inputmode="decimal" id="budIn" placeholder="预算金额"><button id="budSet">设定</button></div></div>`;
  }
  $('#p-stat').innerHTML=segStat()+bud+`<div class="mnav"><button id="mPrev">←</button>
    <strong>${base.getFullYear()} 年 ${base.getMonth()+1} 月</strong>
    <button id="mNext" ${mOff===0?'disabled style="opacity:.35"':''}>→</button></div>`+
    (!rs.length?'<div class="empty"><b>这个月是空的</b>记一笔，这里就有东西看了</div>':`
    <div class="total num">${yuan(total)}</div>
    <div class="num" style="color:var(--ink-soft);font-size:13px">日均 ${yuan(total/past)} · 共 ${out.length} 笔${income?' · 收入 '+yuan(income):''}</div>
    ${advM?`<div style="color:var(--ink-soft);font-size:12.5px;margin-top:3px">另有垫付 ${yuan(advM)} 未计入（不是个人消费）</div>`:''}
    <div class="cols">${daily.map(v=>`<i style="height:${Math.max(v/mx*100,2)}%"></i>`).join('')}</div>
    <div style="font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between"><span>1 日</span><span>${days} 日</span></div>
    <div style="margin-top:18px">${rank.map(([k,v])=>{const c=catOf(k);return `<div class="bar">
      <div class="l"><span style="display:flex;align-items:center;gap:7px;color:${c.c}">${ico(k,15)}<b style="color:var(--ink);font-weight:500">${c.n}</b></span>
        <span class="num">${yuan(v)} · ${Math.round(v/total*100)}%</span></div>
      <div class="track"><i style="width:${v/total*100}%;background:${c.c}"></i></div></div>`}).join('')}</div>`);
  bindSeg();
  $('#mPrev').onclick=()=>{mOff++;renderStat()};
  $('#mNext').onclick=()=>{if(mOff>0){mOff--;renderStat()}};
  const bs=$('#budSet'); if(bs) bs.onclick=async()=>{
    const v=parseFloat($('#budIn').value); if(!(v>0)){toast('填个大于 0 的数');return;}
    budget=Math.round(v*100)/100; await save(); renderStat(); toast('预算已设为 '+yuan(budget));
  };
}



/* ══════ 财务轨迹：年 → 月 → 日 ══════
   只读现有账目，不新建数据、不改存储。
   垫付和报销不计入真实收支，但当天仍算"有记账活动"，用描边格单独表示。 */
let trMode='year', trY=new Date().getFullYear(), trM=0, trDate='';

function dayMap(y){
  const m={};
  records.forEach(r=>{
    if(+r.date.slice(0,4)!==y) return;
    const d=m[r.date]||(m[r.date]={inc:0,exp:0,n:0});
    d.n++;
    if(isRealInc(r)) d.inc+=r.amount;
    else if(isRealExp(r)) d.exp+=r.amount;
  });
  return m;
}
const q=(arr,p)=>{if(!arr.length)return Infinity;const a=[...arr].sort((x,y)=>x-y);
  return a[Math.min(a.length-1,Math.floor(a.length*p))];};
/* 一格的状态：颜色只表示"发生过什么"，金额只影响深浅两档 */
function cellCls(d,hiE,hiN){
  if(!d) return '';
  const e=d.exp>0, n=d.inc>0;
  if(e&&n) return 'b';
  if(e) return 'e'+(d.exp>=hiE?'':' lt');
  if(n) return 'n'+(d.inc>=hiN?'':' lt');
  return d.n?'a':'';
}
const MDAYS=(y,m)=>new Date(y,m+1,0).getDate();
const OFFSET=(y,m)=>(new Date(y,m,1).getDay()+6)%7;   // 周一开头

function renderTrack(){
  if(trMode==='month') return trackMonth();
  if(trMode==='day') return trackDay();
  trackYear();
}

function trackYear(){
  const M=dayMap(trY), days=Object.values(M);
  const hiE=q(days.filter(d=>d.exp>0).map(d=>d.exp),.75);
  const hiN=q(days.filter(d=>d.inc>0).map(d=>d.inc),.75);
  let inc=0,exp=0; days.forEach(d=>{inc+=d.inc;exp+=d.exp;});
  const today=key(new Date()), curY=+today.slice(0,4), curM=+today.slice(5,7)-1;

  let grid='';
  for(let m=0;m<12;m++){
    const off=OFFSET(trY,m), nd=MDAYS(trY,m);
    let cells='';
    for(let i=0;i<off;i++) cells+='<i class="o"></i>';
    for(let d=1;d<=nd;d++){
      const k=`${trY}-${pad2(m+1)}-${pad2(d)}`;
      cells+=`<i class="${cellCls(M[k],hiE,hiN)}"></i>`;
    }
    grid+=`<button class="mo ${trY===curY&&m===curM?'now':''}" data-m="${m}">
      <span class="mn">${m+1} 月</span><span class="mg">${cells}</span></button>`;
  }
  $('#p-stat').innerHTML=segStat()+`
    <div class="trhead">
      <button data-y="-1">‹ ${trY-1}</button>
      <span class="yr num">${trY}</span>
      <button data-y="1">${trY+1} ›</button>
    </div>
    ${days.length?`<div class="trsum num">
      <div><span>收入</span><b class="in">${yuan(inc)}</b></div>
      <div><span>支出</span><b>${yuan(exp)}</b></div>
      <div><span>结余</span><b>${yuan(inc-exp)}</b></div>
    </div>`:`<div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">
      这一年还没有记账记录</div>`}
    <div class="trgrid">${grid}</div>
    <div class="legend">
      <span><i style="background:#E2E4DD"></i>无记录</span>
      <span><i style="background:#C46240"></i>支出</span>
      <span><i style="background:#2E7D5B"></i>收入</span>
      <span><i style="background:linear-gradient(135deg,#C46240 0 50%,#2E7D5B 50% 100%)"></i>收支</span>
      <span><i style="box-shadow:inset 0 0 0 1px #BFC2B8"></i>仅垫付/报销</span>
    </div>
    <div class="foot">${days.length?`这一年有 ${days.length} 天记了账。颜色深浅表示当天金额是否偏高。`:''}
      点某个月进入月视图。垫付和报销不计入收支合计。</div>`;
  bindSeg();
  $('#p-stat').querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{
    trY+=+b.dataset.y; renderTrack(); });
  $('#p-stat').querySelectorAll('.mo').forEach(b=>b.onclick=()=>{
    trM=+b.dataset.m; trMode='month'; renderTrack();
    document.querySelector('main').scrollTop=0; });
}

function trackMonth(){
  const M=dayMap(trY), nd=MDAYS(trY,trM), off=OFFSET(trY,trM);
  const days=Object.values(M);
  const hiE=q(days.filter(d=>d.exp>0).map(d=>d.exp),.75);
  const hiN=q(days.filter(d=>d.inc>0).map(d=>d.inc),.75);
  const today=key(new Date());
  let inc=0,exp=0;
  const di=[],de=[];
  for(let d=1;d<=nd;d++){
    const x=M[`${trY}-${pad2(trM+1)}-${pad2(d)}`]||{inc:0,exp:0,n:0};
    inc+=x.inc; exp+=x.exp; di.push(x.inc); de.push(x.exp);
  }
  let cells='<div class="wd">一</div><div class="wd">二</div><div class="wd">三</div>'
    +'<div class="wd">四</div><div class="wd">五</div><div class="wd">六</div><div class="wd">日</div>';

/* ══════ 财务体检 ══════ */
const prevYM=(ym,k=1)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1-k,1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);};
function mstat(m){
  const rs=records.filter(r=>r.date.startsWith(m));
  /* 真实收支：垫付不算消费，报销不算收入；核销掉的垫付回到真实消费 */
  const exp=rs.filter(isRealExp), inc=rs.filter(isRealInc);
  const advRs=rs.filter(isAdv), reimRs=rs.filter(r=>r.nature==='reim');
  const advOut=sum(advRs), reimIn=sum(reimRs);
  const byCat={}; exp.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+r.amount);
  const F=r=>flags(r);
  return {m,n:rs.length,exp:sum(exp),inc:sum(inc),advOut,reimIn,
    cashFlow:sum(inc)+reimIn-sum(exp)-advOut,
    stable:sum(inc.filter(isStable)), oneInc:sum(inc.filter(r=>!isStable(r))),
    fixed:sum(exp.filter(r=>F(r).fixed)), debt:sum(exp.filter(r=>F(r).debt)),
    need:sum(exp.filter(r=>F(r).need&&!F(r).once)), once:sum(exp.filter(r=>F(r).once)),
    onceRs:exp.filter(r=>F(r).once), byCat, rs, expRs:exp};
}
const worst=(a,b)=>({n:0,g:1,y:2,r:3}[a]>={n:0,g:1,y:2,r:3}[b]?a:b);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

function avgNeedMonthly(){
  const nowYM=key(new Date()).slice(0,7);
  const has=m=>records.some(r=>r.date.startsWith(m));
  let P=prevYM(nowYM,1); if(!has(P))P=nowYM;
  const ms=[P,...[1,2,3].map(k=>prevYM(P,k))].filter(has).map(mstat);
  return avg(ms.map(x=>x.need));
}
/* 可支配资金：现金里真正还没有归属的部分 */
function disposable(){
  const need=avgNeedMonthly();
  const rows=[
    ['账户现金',cashNow()],
    ['待报销',-owed()],
    [`必要支出预留 ${settings.needMo} 个月`,-need*settings.needMo],
    [`应急储备 ${settings.reserveMo} 个月`,-need*settings.reserveMo],
    ['各桶已累计',-bkTotal()]
  ];
  return {rows,total:rows.reduce((s,r)=>s+r[1],0),need};
}
function analyze(){
  calcAvg();
  const nowYM=key(new Date()).slice(0,7);
  const has=m=>records.some(r=>r.date.startsWith(m));
  let P=prevYM(nowYM,1), partial=false;
  if(!has(P)){ P=nowYM; partial=true; }
  const cur=mstat(P);
  const prior=[1,2,3].map(k=>prevYM(P,k)).filter(has).map(mstat);
  const stableInc=avg([cur,...prior].filter(s=>s.inc>0).map(s=>s.stable))||cur.stable;
  const avgNeed=avgNeedMonthly()||cur.need;
  const checks=[], issues=[];
  const cashCur=cashNow(), RM=settings.reserveMo||3;
  const L=(m)=>m.split('-')[1].replace(/^0/,'')+' 月';

  /* ① 收支健康 */
  const bal=cur.inc-cur.exp, rate=cur.inc>0?bal/cur.inc:null;
  let c1={k:'收支健康',lp:'n',v:'缺收入记录',d:'本期没有收入记录，无法判断收入是否覆盖支出。把工资、外快也记进来，这一项才有意义。'};
  if(cur.inc>0){
    let deficit=0,mm=P;
    while(has(mm)){const s=mstat(mm); if(s.inc>0&&s.inc-s.exp<0){deficit++;mm=prevYM(mm,1);}else break;}
    if(bal<0&&deficit>=2) c1={k:'收支健康',lp:'r',v:'连续 '+deficit+' 期赤字',
      d:`已经连续 <b>${deficit}</b> 个月支出大于收入，本期缺口 <b>${yuan(-bal)}</b>。这不是波动，是当前的收支结构撑不住。`};
    else if(bal<0){
      const priorOK=prior.filter(s=>s.inc>0), explained=cur.once>=-bal&&priorOK.length&&priorOK.every(s=>s.inc-s.exp>0);
      c1={k:'收支健康',lp:explained?'g':'y',v:'本期缺口 '+yuan(-bal),
        d:`收入 ${yuan(cur.inc)}，支出 ${yuan(cur.exp)}，缺口 <b>${yuan(-bal)}</b>。`+
          (explained?`本期一次性支出 ${yuan(cur.once)}，已经足以解释这个缺口，而前 ${priorOK.length} 期都是正结余。属于单次大额消费，不是收支结构出问题。`
            :cur.once>=-bal?`其中一次性支出 ${yuan(cur.once)} 可以解释缺口，但之前也出现过赤字，要往下看。`
            :'一次性支出不足以解释缺口，需要看下面的专项检查。')};
    }
    else if(rate<0.1) c1={k:'收支健康',lp:'y',v:'结余率 '+pct(rate),
      d:`结余 <b>${yuan(bal)}</b>，只占收入 ${pct(rate)}。没有亏，但缓冲很薄，一次意外就会转负。`};
    else{
      const pr=prior.filter(s=>s.inc>0).map(s=>(s.inc-s.exp)/s.inc);
      const drop=pr.length&&avg(pr)-rate>=0.15;
      c1=drop?{k:'收支健康',lp:'y',v:'结余率 '+pct(rate)+'（下降）',
        d:`结余 <b>${yuan(bal)}</b>，结余率 ${pct(rate)}，低于前几期的 ${pct(avg(pr))}。还是正的，但在往下走。`}
        :{k:'收支健康',lp:'g',v:'结余率 '+pct(rate),
        d:`收入 ${yuan(cur.inc)}，支出 ${yuan(cur.exp)}，结余 <b>${yuan(bal)}</b>。收入能覆盖支出并留下余量。`};
    }
  }
  checks.push(c1);

  /* ② 现金安全 */
  let c2;
  if(!cashAt) c2={k:'现金安全',lp:'n',v:'未设置',
    d:'还没填过账户余额，算不出保障月数。去「资金」页填一次此刻的可动用余额，之后程序会按流水自己推算。'};
  else if(avgNeed<=0) c2={k:'现金安全',lp:'n',v:'缺支出记录',d:'还算不出每月必要支出。记满一个月再看。'};
  else{
    const mo=cashCur/avgNeed;
    const d=`账户现金 <b>${yuan(cashCur)}</b>，月均必要支出 <b>${yuan(avgNeed)}</b>（只算必要、且排除一次性），
      断收入能撑 <b>${mo.toFixed(1)} 个月</b>。你把应急储备设成了 ${RM} 个月，这里就以此为合格线。
      看的是极端情况下的下限，不是日常花销。`;
    c2={k:'现金安全',lp:mo<RM*0.5?'r':mo<RM?'y':'g',v:mo.toFixed(1)+' 个月',d};
  }
  checks.push(c2);

  /* ③ 固定支出压力 */
  let c3;
  if(!stableInc) c3={k:'固定支出压力',lp:'n',v:'缺稳定收入',d:'没有稳定收入记录，算不出占比。工资记进来即可。'};
  else{
    const r3=cur.fixed/stableInc;
    c3={k:'固定支出压力',lp:r3<0.35?'g':r3<0.5?'y':'r',v:pct(r3),
      d:`本期固定支出 <b>${yuan(cur.fixed)}</b>（房租、还款、订阅这类不可调整的），占稳定收入 ${yuan(stableInc)} 的 <b>${pct(r3)}</b>。
        这部分在月初就已经锁死，剩下的 ${yuan(stableInc-cur.fixed)} 才是能自己安排的。`};
  }
  checks.push(c3);

  /* ④ 负债压力 */
  let c4;
  if(cur.debt<=0) c4={k:'负债压力',lp:'g',v:'无还款记录',d:'本期没有记录到贷款或信用卡还款。如果实际有，记一笔「还款」分类，这一项才准。'};
  else if(!stableInc) c4={k:'负债压力',lp:'n',v:'缺稳定收入',d:'有还款记录但没有稳定收入数据，算不出压力比例。'};
  else{
    const r4=cur.debt/stableInc;
    c4={k:'负债压力',lp:r4<0.2?'g':r4<0.4?'y':'r',v:pct(r4),
      d:`每月还款 <b>${yuan(cur.debt)}</b>，占稳定收入的 <b>${pct(r4)}</b>。看的是每月现金流压力，不是欠款总额——
        总额大但月供轻、现金厚，未必危险；总额小但月供吃掉大半收入，才是真问题。`};
  }
  checks.push(c4);

  /* ── 第二层：只有触发才查 ── */
  const prevBal=prior.filter(s=>s.inc>0).map(s=>s.inc-s.exp);
  if(prior.length>=1&&cur.inc>0&&prevBal.length){
    const drop=avg(prevBal)-bal;
    if(drop>=300&&drop>=Math.abs(avg(prevBal))*0.25){
      const incDrop=avg(prior.map(s=>s.inc))-cur.inc, expUp=cur.exp-avg(prior.map(s=>s.exp));
      const deltas=Object.keys(cur.byCat).map(k=>[k,cur.byCat[k]-avg(prior.map(s=>s.byCat[k]||0))])
        .sort((a,b)=>b[1]-a[1]);
      const top=deltas[0];
      const onceInTop=top?sum(cur.onceRs.filter(r=>r.cat===top[0])):0;
      const oneShot=cur.once>=drop*0.7;
      let why,judge,adv,sev;
      if(incDrop>expUp&&incDrop>0){
        const stDrop=avg(prior.map(s=>s.stable))-cur.stable;
        why=`收入减少 ${yuan(incDrop)} 是主因，支出变化 ${expUp>=0?'+':''}${yuan(expUp)}。`;
        if(stDrop<incDrop*0.5){judge='减少的主要是奖金、报销这类一次性收入，稳定收入没有明显下降。';sev='g';
          adv='属于收入结构的正常波动，不用调整支出计划。';}
        else{judge=`稳定收入本身下降了 ${yuan(stDrop)}，会持续影响后面每个月。`;sev='r';
          adv='按新的稳定收入重算固定支出占比，先看有没有能退订、能重谈的固定项。';}
      }else{
        why=`支出比前几期多了 ${yuan(expUp)}，`+(top&&top[1]>0?`增加最多的是${catOf(top[0]).n} ${yuan(top[1])}。`:'没有集中在某一类。');
        if(oneShot){judge=`本期一次性支出 ${yuan(cur.once)}，足以解释这次下降${onceInTop>0?`（其中${catOf(top[0]).n}里有 ${yuan(onceInTop)} 是单笔大额）`:''}。属于短期波动。`;
          sev='g';adv='不需要因此调整长期预算。下期如果结余自动回到原来水平，说明判断正确。';}
        else{let n=0,mm=P; while(has(mm)){const s=mstat(mm),p=mstat(prevYM(mm,1));
            if(has(prevYM(mm,1))&&(s.inc-s.exp)<(p.inc-p.exp)){n++;mm=prevYM(mm,1);}else break;}
          judge=n>=3?`结余已经连续 ${n} 期下降，且不是一次性消费造成的，是趋势。`
            :'增加的是可重复发生的日常消费，不是单次大额。';
          sev=n>=3?'r':'y';
          adv=top&&top[1]>0?`先盯${catOf(top[0])
            .n}这一类：它比平时多了 ${yuan(top[1])}，只要压回原来的水平，结余就能补回大半。`
            :'下期重点看支出总量是否回落，回不去就要动固定项。';}
      }
      issues.push({sev,h:`本期结余比前几期少了 ${yuan(drop)}`,
        rows:[['发生了什么',`结余 ${yuan(bal)}，前几期平均 ${yuan(avg(prevBal))}。`],['为什么',why],['是否严重',judge],['要不要处理',adv]]});
    }
  }

  /* 消费异常：与自己的历史基准比 */
  if(prior.length>=2){
    const thr=Math.max(200,stableInc*0.05);
    const abn=Object.keys(cur.byCat).map(k=>{
      const base=avg(prior.map(s=>s.byCat[k]||0)); return {k,cur:cur.byCat[k],base,d:cur.byCat[k]-base};
    }).filter(x=>x.d>=thr&&(x.base===0?x.cur>=thr*1.5:x.d/x.base>=0.5))
      .sort((a,b)=>b.d-a.d).slice(0,2);
    abn.forEach(x=>{
      const c=catOf(x.k),f=flags,rs=cur.expRs.filter(r=>r.cat===x.k);
      const onceSum=sum(rs.filter(r=>f(r).once)), need=RULE[x.k]&&RULE[x.k].need;
      const repeated=prior.filter(s=>(s.byCat[x.k]||0)>x.base*1.2).length>=2;
      const oneShot=onceSum>=x.d*0.7;
      issues.push({sev:oneShot?'g':repeated?'r':'y',
        h:`${c.n}明显高于你自己的平常水平`,
        rows:[['发生了什么',`本期 ${yuan(x.cur)}，过去 ${prior.length} 期平均 ${yuan(x.base)}，多了 ${yuan(x.d)}。`],
          ['为什么',rs.length?`共 ${rs.length} 笔，最大一笔 ${yuan(Math.max(...rs.map(r=>r.amount)))}${onceSum?`，其中 ${yuan(onceSum)} 被判定为一次性大额`:'，没有特别突出的单笔'}。`:''],
          ['是否严重',oneShot?'主要来自一次性大额，不代表日常消费失控。'
            :repeated?'不是单次，前面几期也在往上走，属于持续变化。'
            :need?'属于必要支出，金额上升但不是可随意削减的部分。':'是可调整的消费，且这一期是单独抬高。'],
          ['要不要处理',oneShot?'不用。下期回到平常水平就说明是正常波动。'
            :repeated?`需要。把${c.n}压回 ${yuan(x.base)} 附近，每月能多留 ${yuan(x.d)}。`
            :`先观察一期。如果下期还是这个水平，再按每月多 ${yuan(x.d)} 来处理。`]]});
    });
  }

  /* 固定支出变化 */
  if(prior.length>=1){
    const bf=avg(prior.map(s=>s.fixed)), df=cur.fixed-bf;
    if(df>=100&&(bf===0||df/bf>=0.1)){
      const news=Object.keys(cur.byCat).filter(k=>(RULE[k]||{}).fixed&&cur.byCat[k]-avg(prior.map(s=>s.byCat[k]||0))>=50)
        .map(k=>catOf(k).n);
      issues.push({sev:stableInc&&cur.fixed/stableInc>=0.5?'r':'y',
        h:`固定支出比之前多了 ${yuan(df)}`,
        rows:[['发生了什么',`本期固定支出 ${yuan(cur.fixed)}，之前平均 ${yuan(bf)}。`],
          ['为什么',news.length?`增加集中在${news.join('、')}。`:'新增了长期性支出。'],
          ['是否严重','一次性消费花完就没了，固定支出会持续压缩以后每个月的可支配收入，影响是累积的。'+
            (stableInc?`按现在的水平，一年多支出约 ${yuan(df*12)}。`:'')],
          ['要不要处理',`逐项确认这些是不是长期需要。订阅类最容易堆积，退掉一项每月立刻回来 ${yuan(df/Math.max(news.length,1))} 左右。`]]});
    }
  }

  /* 垫付与报销：独立模块，不污染上面四项，但计入现金流风险 */
  const open_=advOpen(), owe=owed();
  const stale=open_.filter(x=>(Date.now()-new Date(x.a.date+'T00:00:00'))/864e5>=60);
  const ratio=cashCur>0?owe/cashCur:null;
  let rl='g',rt='无待报销',rd='本期没有未收回的垫付款。';
  if(owe>0){
    rl=(ratio!==null&&ratio>=0.5)||(ratio===null&&avgNeed>0&&owe>=avgNeed)?'r':'y';
    rt='待收 '+yuan(owe);
    rd=`有 <b>${yuan(owe)}</b> 垫出去还没收回，分布在 ${open_.length} 笔上。这笔钱不是消费也不是亏损，但现在不在你手上。`
      +(ratio!==null?`相当于可动用现金的 <b>${pct(ratio)}</b>。`:'')
      +(rl==='r'?'占用比例偏高，报销一旦拖延会直接压到现金安全。':'');
    if(stale.length) rd+=` 其中 ${stale.length} 笔已经超过 60 天。`;
  }
  const reimb={lp:rl,v:rt,d:rd,owe,open:open_,stale,
    advOut:cur.advOut,reimIn:cur.reimIn,ratio};
  if(rl!=='g') issues.push({sev:rl==='r'?'r':'g',
    h:rl==='r'?`待报销 ${yuan(owe)} 占用了较多现金`:`存在 ${yuan(owe)} 待报销款`,
    rows:[['发生了什么',`本期垫付 ${yuan(cur.advOut)}，收到报销 ${yuan(cur.reimIn)}，累计待收回 ${yuan(owe)}。`],
      ['为什么','这是替公司或他人先付的钱，属于短期资金占用，不是个人消费增加。'],
      ['是否严重',rl==='r'?`占可动用现金 ${ratio!==null?pct(ratio):'较大比例'}，属于现金流风险，不是消费问题。`
        :'金额在可承受范围，个人收入、消费和结余都不受影响。'],
      ['要不要处理',stale.length?`先催超过 60 天那 ${stale.length} 笔。收不回来的，在明细里标为「报销不了」，它才会正确计入个人支出。`
        :rl==='r'?'优先推进报销进度，暂时避免继续大额垫付。':'不用。盯着报销进度即可。']]});

  if(cashCur&&avgNeed>0&&owe>0){
    const c2i=checks.find(c=>c.k==='现金安全');
    c2i.d+=` 另有 ${yuan(owe)} 待报销在外，收回后保障月数会到 ${((cashCur+owe)/avgNeed).toFixed(1)} 个月。`;
  }

  const gradeChecks=worst(checks.reduce((a,c)=>worst(a,c.lp),'g'),rl==='r'?'r':'g');
  const disp=disposable();
  const gradeIssues=issues.reduce((a,i)=>worst(a,i.sev),'g');
  const grade=worst(gradeChecks,gradeIssues);
  return {P,partial,cur,prior,checks,issues,grade,stableInc,avgNeed,bal,rate,reimb,disp,cashCur};
}

  </button>

  <h3 class="sec">基础检查</h3>
  ${A.checks.map((c,i)=>`<div class="chk" data-i="${i}"><button>
    <span class="lp ${c.lp}"></span><span class="nm">${c.k}</span>
    <span class="vv num">${c.v}</span><span class="arw">▾</span></button>
    <div class="cv">${c.d}</div></div>`).join('')}

  ${(A.reimb.owe>0||A.reimb.advOut>0||A.reimb.reimIn>0)?`
  <h3 class="sec">💼 垫付与报销</h3>
  <div class="adv">
    <div class="r"><span>本期垫付</span><span class="num">${yuan(A.reimb.advOut)}</span></div>
    <div class="r"><span>本期收到报销</span><span class="num">${yuan(A.reimb.reimIn)}</span></div>
    <div class="r big"><span><span class="lp ${A.reimb.lp}" style="display:inline-block;margin-right:7px"></span>当前待报销</span>
      <span class="num">${yuan(A.reimb.owe)}</span></div>
    <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.65;margin-top:9px">${A.reimb.d}</div>

      (Date.now()-new Date(x.a.date+'T00:00:00'))/864e5>=60?' · 已超 60 天':''}</li>`).join('')}</ul>`:''}
  </div>`:''}

  <h3 class="sec">发现的问题</h3>

    <dl>${i.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`).join('')
    :`<div class="ok">未发现需要处理的问题。${A.issues.length?'有变化但都已排查清楚，见下。':'各项指标处在正常范围，支出结构也没有偏离你自己的历史水平。'}</div>`}

  ${cleared.length?`<h3 class="sec">已排查 · 无需处理</h3>`+cleared.map(i=>`<div class="issue g"><h4>🟢 ${i.h}</h4>

  <h3 class="sec">生成报告</h3>

  $('#toFund').onclick=()=>document.querySelector('nav button[data-p="fund"]').click();
  el.querySelectorAll('.chk>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  $('#repBtn').onclick=()=>showReport(A);
}


/* ══════ 导入导出 ══════ */
/* 导入前把整份文件逐条校验完，任何一条不合格就整体拒绝——
   不允许出现「写到第 57 条才失败」的半导入状态。 */
function validateImport(d){
  if(!d||typeof d!=='object') return '顶层不是一个对象。';
  if(!Array.isArray(d.records)) return '缺少 records 数组，可能不是本 App 导出的备份。';
  const seen=new Set();
  for(let i=0;i<d.records.length;i++){
    const r=d.records[i], at=`第 ${i+1} 条账目`;
    if(!r||typeof r!=='object') return at+'不是一个对象。';
    if(typeof r.id!=='string'||!r.id) return at+'缺少 id。';
    if(seen.has(r.id)) return at+`的 id 与前面重复（${r.id}）。`;
    seen.add(r.id);
    if(typeof r.amount!=='number'||!isFinite(r.amount)||r.amount<0)
      return at+`的金额不是有效数字（${JSON.stringify(r.amount)}）。`;
    if(typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date))
      return at+`的日期格式不对（${JSON.stringify(r.date)}），应为 2026-09-10 这样。`;
    if(r.type!=='expense'&&r.type!=='income') return at+`的收支类型不对（${JSON.stringify(r.type)}）。`;
    if(typeof r.cat!=='string'||!r.cat) return at+'缺少分类。';
  }
  if(d.allocs!==undefined){
    if(!Array.isArray(d.allocs)) return 'allocs 不是数组。';
    for(let i=0;i<d.allocs.length;i++){
      const a=d.allocs[i], at=`第 ${i+1} 条划账记录`;
      if(!a||typeof a.id!=='string'||!a.id) return at+'缺少 id。';
      if(typeof a.bid!=='string'||!a.bid) return at+'缺少资金方向。';
      if(typeof a.amount!=='number'||!isFinite(a.amount)) return at+'金额无效。';
    }
  }
  if(d.budget!==undefined&&typeof d.budget!=='number') return 'budget 不是数字。';
  if(d.cashBase!==undefined&&typeof d.cashBase!=='number') return 'cashBase 不是数字。';
  if(d.cash!==undefined&&typeof d.cash!=='number') return 'cash 不是数字。';
  if(d.buckets!==undefined&&!Array.isArray(d.buckets)) return 'buckets 不是数组。';
  return null;
}
const snap=()=>({v:2,exportedAt:new Date().toISOString(),
  records,budget,cashBase,cashAt,cashTs,migrated,buckets,allocs,settings,lock});
/* 导出以库里的真实数据为准，不是内存副本 */
async function snapFromDB(){
  if(SS.mode!=='idb') return snap();
  const rs=await allOf('transactions'), al=await allOf('allocs');
  const c=(await kvGet('settings','config'))||{};
  return {v:2,exportedAt:new Date().toISOString(),source:'indexeddb',
    records:rs,allocs:al,budget:c.budget||0,cashBase:c.cashBase||0,
    cashAt:c.cashAt||'',cashTs:c.cashTs||0,
    migrated:c.migrated||0,buckets:c.buckets||buckets,settings:c.settings||settings,lock:c.lock||lock};
}
function dl(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function toCsv(){
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const head=['日期','收支','分类','金额','备注','资金性质','固定','必要','一次性','债务','资金方向','关联垫付'];
  const rows=[...records].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).map(r=>{
    const f=flags(r);
    return [r.date, r.type==='income'?'收入':'支出', catOf(r.cat).n, r.amount, r.note||'',
      r.nature==='adv'?(r.off?'垫付·自己承担':'垫付'):r.nature==='reim'?'报销到账':'',
      f.fixed?'是':'', f.need?'是':'', f.once?'是':'', f.debt?'是':'',
      r.bk&&bkOf(r.bk)?bkOf(r.bk).name:'', r.gid||''].map(q).join(',');
  });
  return '\ufeff'+[head.map(q).join(','),...rows].join('\r\n');
}
function bindData(){
  $('#expJson').onclick=async()=>{
    try{
      const d=await snapFromDB();
      dl('流水账备份-'+key(new Date())+'.json',JSON.stringify(d,null,1),'application/json');
      toast(`已导出 ${d.records.length} 笔`);
      if(SS.mode==='idb'&&d.records.length!==records.length)
        banner(`<b>注意</b>库里 ${d.records.length} 条，界面显示 ${records.length} 条，对不上。导出的是库里的真实数据，建议重开一次 App。`);
    }catch(e){ toast('导出失败：'+((e&&e.message)||e)); }
  };
  $('#expCsv').onclick=()=>{
    if(!records.length){toast('还没有账目');return;}
    dl('流水账-'+key(new Date())+'.csv',toCsv(),'text/csv;charset=utf-8');
    toast('CSV 已导出，可用 Excel 打开');
  };
  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{
      let d;
      try{ d=JSON.parse(rd.result); }
      catch(err){ alert('这个文件不是有效的 JSON，没有做任何改动。'); return; }
      const bad=validateImport(d);
      if(bad){ alert('备份文件有问题，已拒绝导入，你的账本没有任何改动。\n\n'+bad); return; }
      const have=new Set(records.map(r=>r.id));
      const add=d.records.filter(r=>!have.has(r.id));
      const ds=d.records.map(r=>r.date).sort();
      const info=`备份里有 ${d.records.length} 笔`+(ds.length?`（${ds[0]} 至 ${ds[ds.length-1]}）`:'')
        +`\n其中 ${add.length} 笔是本机没有的。\n\n`
        +`导入方式是【合并】：现有 ${records.length} 笔一条都不会被删除或覆盖，`
        +`只把新的追加进来，重复的按编号跳过。\n\n要继续吗？`;
      if(!confirm(info)) { toast('已取消'); return; }
      records=records.concat(add);
      if(d.budget) budget=d.budget;
      const cb=d.cashBase!==undefined?d.cashBase:d.cash;
      if(cb!==undefined&&confirm(`备份里的账户基准是 ${yuan(cb)}（${d.cashAt||'无日期'}）。\n`
        +`要用它替换本机当前的基准 ${yuan(cashBase)} 吗？\n\n换新手机恢复数据时选「确定」。`)){
        cashBase=cb; cashAt=d.cashAt||cashAt; cashTs=d.cashTs||0;
      }
      if(d.settings) settings=Object.assign({},settings,d.settings);
      if(d.buckets&&d.buckets.length&&!buckets.some(b=>bkBal(b.id)!==0)) buckets=d.buckets;
      if(d.allocs){ const hb=new Set(allocs.map(a=>a.id));
        allocs=allocs.concat(d.allocs.filter(a=>!hb.has(a.id))); }
      await save(); renderAll();
      if($('#p-set').classList.contains('on')) renderSet(); else renderFund();
      toast(`已合并 ${add.length} 笔`);
    };
    rd.readAsText(f);
  };
}

/* ══════ 打开时的密码 / 生物识别 ══════
   只存 PBKDF2 派生值，不存密码本身；生物识别走系统 WebAuthn，
   App 不接触指纹或面容数据。这是一道门，不是加密。 */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pinHash(pin,salt,it){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:ub64(salt),iterations:it,hash:'SHA-256'},k,256);
  return b64(bits);
}
async function bioAvail(){
  try{ return !!window.PublicKeyCredential
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
async function bioReg(){
  const c=await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:'流水账',id:location.hostname},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'流水账',displayName:'流水账'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    /* residentKey 用 discouraged：只要一个绑定本机的凭据，
       不需要生成同步到 iCloud 的通行密钥——这里只是本地解锁，不是登录账号 */
    authenticatorSelection:{authenticatorAttachment:'platform',
      userVerification:'required',residentKey:'discouraged',requireResidentKey:false},
    attestation:'none',timeout:60000}});
  if(!c) throw new Error('没有返回凭据');
  return b64(c.rawId);
}
async function bioVerify(id){
  const r=await navigator.credentials.get({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:ub64(id),transports:['internal']}],
    userVerification:'required',timeout:60000}});
  if(!r) throw new Error('验证没有返回结果');
  return true;
}
async function setPin(){
  const a=prompt(lock.on?'输入新密码（建议 4～8 位数字）':'设置密码（建议 4～8 位数字）');
  if(a===null) return;
  if(!a||a.length<4){ toast('至少 4 位'); return; }
  const b=prompt('再输一次确认');
  if(b!==a){ toast('两次不一致'); return; }
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))), it=150000;
  lock={on:true,salt,it,hash:await pinHash(a,salt,it),bio:lock.bio};
  if(!lock.bio) delete lock.bio;
  await save();
  toast('密码已设置，下次打开生效');
}
function showLock(){
  document.body.classList.add('locked');
  $('#lock').classList.add('on');
  $('#bioGo').style.display=lock.bio?'':'none';
  $('#lockMsg').textContent='';
  $('#lockSub').textContent=lock.bio?'用面容 / 指纹解锁，或输入密码':'输入密码解锁';
  /* 不自动触发生物识别：Safari 要求必须由用户点击发起，
     自动调用会弹出系统框但验证不通过 */
}
function unlock(){
  $('#lock').classList.remove('on');
  document.body.classList.remove('locked');
  $('#pinIn').value='';
}
let tries=0;
async function tryPin(){
  const v=$('#pinIn').value;
  if(!v) return;
  if(await pinHash(v,lock.salt,lock.it)===lock.hash){ tries=0; unlock(); return; }
  tries++; $('#pinIn').value='';
  $('#lockMsg').textContent=tries>=3?`密码不对（已错 ${tries} 次）`:'密码不对';
}
async function tryBio(){
  const b=$('#bioGo');
  b.disabled=true; b.textContent='验证中…';
  try{ await bioVerify(lock.bio); unlock(); }
  catch(e){
    const n=(e&&e.name)||'', m=(e&&e.message)||'';
    $('#lockMsg').textContent=
      n==='NotAllowedError'?'已取消或超时，再点一次试试'
      :n==='InvalidStateError'?'这台设备上的凭据已失效，请用密码进入后重新启用'
      :n==='SecurityError'?'当前地址不支持生物识别，请用密码'
      :'没通过，用密码试试'+(m?`（${n||m}）`:'');
  }
  b.disabled=false; b.textContent='用面容 / 指纹解锁';
}
$('#pinGo').onclick=tryPin;
$('#pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin();});
$('#bioGo').onclick=()=>tryBio();
$('#lockEsc').onclick=()=>{

  if(!confirm('再确认一次：这会删掉本机全部账目，无法撤销。')) return;
  (async()=>{
    try{
      /* 先删冻结快照：否则一旦清库成功而这步失败，
         下次启动会把快照当成待迁移数据重新导回来 */
      localStorage.removeItem(KEY);
      if(SS.mode==='idb'){
        const t=idb.transaction(['transactions','allocs','settings','meta'],'readwrite');
        ['transactions','allocs','settings','meta'].forEach(n=>t.objectStore(n).clear());
        await txDone(t);
      }
    }catch(e){}
    location.reload();
  })();
};

/* ══════ 标准化报告：程序算完，用户自己拿去问任何 AI ══════ */
function buildReport(A){
  const c=A.cur, D=A.disp, L=A.P.replace('-',' 年 ')+' 月';
  const lamp={g:'🟢 正常',y:'🟡 关注',r:'🔴 需要处理'}[A.grade];
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${catOf(k).n}：${yuan(v)}`).join('\n');
  const chk=A.checks.map(x=>`${{g:'🟢',y:'🟡',r:'🔴',n:'⚪'}[x.lp]} ${x.k}：${x.v}`).join('\n');
  const strip=t=>String(t).replace(/<[^>]+>/g,'');
  const iss=A.issues.length?A.issues.map(i=>
    `${{g:'🟢 已排查',y:'🟡 关注',r:'🔴 需处理'}[i.sev]}｜${i.h}\n`+
    i.rows.map(([a,b])=>`  ${a}：${strip(b)}`).join('\n')).join('\n\n')
    :'未发现需要说明的异常。';
  const bk=buckets.map(b=>`${b.name}：${b.pct}%，已累计 ${yuan(bkBal(b.id))}`+
    (b.goal?`，目标 ${yuan(b.goal)}（${Math.round(bkBal(b.id)/b.goal*100)}%）`:'')).join('\n');

  return `【个人财务体检报告】
统计周期：${L}${A.partial?'（当月尚未结束，为初步数据）':'（完整月）'}
生成时间：${key(new Date())}

一、收支情况
本期真实收入：${yuan(c.inc)}（其中稳定收入 ${yuan(c.stable)}）
本期个人支出：${yuan(c.exp)}
本期结余：${yuan(A.bal)}
结余率：${A.rate===null?'无法计算（本期无收入记录）':pct(A.rate)}
说明：垫付款不计入个人支出，报销到账不计入个人收入。

二、现金情况
账户现金：${yuan(A.cashCur)}
待报销（垫出去未收回）：${yuan(A.reimb.owe)}
必要支出预留（${settings.needMo} 个月）：${yuan(A.avgNeed*settings.needMo)}
应急储备（${settings.reserveMo} 个月）：${yuan(A.avgNeed*settings.reserveMo)}
已划入各资金方向：${yuan(bkTotal())}
当前可支配资金：${yuan(D.total)}
月均必要支出：${yuan(A.avgNeed)}
本期实际现金变化：${yuan(c.cashFlow)}

三、固定与负债
固定支出：${yuan(c.fixed)}${A.stableInc?`（占稳定收入 ${pct(c.fixed/A.stableInc)}）`:''}
每月债务还款：${yuan(c.debt)}${A.stableInc&&c.debt?`（占稳定收入 ${pct(c.debt/A.stableInc)}）`:''}
月均稳定收入：${yuan(A.stableInc)}

四、主要支出
${cats||'（本期无支出记录）'}
其中一次性支出：${yuan(c.once)}

五、基础检查
${chk}

六、异常情况
${iss}

七、财务体检结论
${lamp}

八、资金分配
${bk}
（百分比合计 ${pctSum()}%）

九、数据说明
本报告全部数字由记账程序计算，未经任何模型推算。
结论只基于我自己记下的流水，漏记会直接改变结果。`;
}

const QT={
  q1:['帮我找问题',`请根据下面这份个人财务体检报告，帮我找出目前最值得关注的 3 个财务问题。

不要为了给出建议而强行制造问题。如果当前没有明显问题，请直接告诉我无需调整。

  q2:['帮我做资金规划',`请根据下面的个人财务情况，帮我检查目前的资金分配是否合理。

不要假设我必须投资。如果当前更适合储蓄或建立现金储备，请直接说明原因。`],
  q3:['帮我控制支出',`请分析下面的个人财务报告。

function showReport(A){
  const out=$('#repOut'), txt=buildReport(A);
  out.innerHTML=`<div class="rep" id="repTxt">${txt.replace(/</g,'&lt;')}</div>
    <div class="qs">
      <button data-q="raw">复制报告</button>
      ${Object.entries(QT).map(([k,v])=>`<button data-q="${k}">${v[0]}</button>`).join('')}
    </div>
    <div class="foot">「复制报告」给你纯数据。后面三个会在报告前面加上一段提问，
      复制完直接粘进 Claude、DeepSeek、ChatGPT 都行——App 不替你选用哪个。</div>`;
  out.onclick=async e=>{

  if(SS.justFailed&&Date.now()-SS.justFailed<2500) return;
